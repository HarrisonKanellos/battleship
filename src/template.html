<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Battleship: Naval Combat</title>
    </head>

    <body>
        <header>
            <h1 class="page-heading">Battleship</h1>
            <p class="sub-heading">Naval Combat</p>
        </header>

        <main>
            <div class="game-wrapper">
                <div class="display-wrapper">
                    <div class="player-ships-wrapper">
                        <h2 class="player-ships-heading">Your Fleet</h2>
                        <div class="ships-container player-ships-container"></div>
                    </div>

                    <div class="gameboard-wrapper">
                        <div class="gameboard player-gameboard"></div>
                    </div>

                    <div class="spinner-wrapper"></div>

                    <div class="gameboard-wrapper">
                        <div class="gameboard enemy-gameboard"></div>
                    </div>

                    <div class="enemy-ships-wrapper">
                        <h2 class="enemy-ships-heading">Enemy Vessels</h2>
                        <div class="ships-container enemy-ships-container"></div>
                    </div>
                </div>

                <div class="status-wrapper"></div>
            </div>
        </main>
    </body>
</html>
