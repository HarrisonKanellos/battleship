        <rect x="90" y="16" width="4" height="1.5" />
        <!-- Aft Mast/Crane structure -->
        <line x1="76" y1="16" x2="79" y2="10" stroke-width="0.8"/>
        <line x1="79" y1="10" x2="75" y2="11" stroke-width="0.5"/>
        <!-- Antennas along the outer deck edge -->
        <line x1="25" y1="16" x2="23" y2="12" stroke-width="0.4"/>
        <line x1="30" y1="16" x2="28" y2="12" stroke-width="0.4"/>
