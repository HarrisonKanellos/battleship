        <!-- Masts & Comm arrays -->
        <line x1="67" y1="6" x2="67" y2="1" stroke-width="1"/>
        <line x1="70" y1="6" x2="70" y2="3" stroke-width="1.2"/>
        <!-- Forward Sponson/CIWS -->
